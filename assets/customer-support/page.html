<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联系我们</title><style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;scrollbar-width:none;color:#12213e;background:#fff;font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;justify-items:center;gap:12px;padding:20px 22px 18px;border:1px solid #c3d6f1;border-radius:8px;text-align:center}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #9bc0ff;outline-offset:2px}
.close{position:absolute;right:12px;top:10px;border:0;background:white;color:#687d9f;font-size:24px;width:36px;height:36px;border-radius:6px}
.heading{width:100%;min-width:0;padding:0 14px}
.logo{display:block;width:116px;height:40px;object-fit:contain;margin:0 auto 6px}


p{font-size:14px;line-height:1.7;color:#7284a3;margin:0}
.qr{height:100%;width:auto;aspect-ratio:1;max-width:100%;max-height:280px;min-height:0;padding:4px;border:1px solid #dce6f4;border-radius:9px;display:grid;place-items:center;align-self:center;background:white;overflow:hidden}
.qr img{display:block;width:100%;height:100%;object-fit:contain;min-width:0;min-height:0}
.qr span{line-height:1.7;color:#7284a3;font-size:14px;white-space:pre-line}
.retry{background:white;border:1px solid #c7d9ff;border-radius:6px;color:#176bff;margin-top:10px;padding:7px 16px}
.confirm{width:100%;height:44px;background:#0968ff;border:0;border-radius:7px;color:white;font-size:15px}
.hint{font-size:13px;line-height:1.6}
[hidden]{display:none!important}
@media(max-height:440px){body{padding:12px 16px;gap:8px}.logo{height:30px;margin-bottom:4px}.heading p{font-size:12px;line-height:1.6}.qr{max-height:240px}.hint{font-size:12px}.confirm{height:40px}}
@media(max-width:320px){body{padding-left:12px;padding-right:12px}.heading{padding:0 16px}.close{right:6px;top:6px}}
</style></head><body><button class="close" aria-label="关闭联系我们">×</button><div class="heading"><img class="logo" src="__SUPPORT_LOGO__" alt="创爆"><p>扫码添加微信，获取使用帮助</p></div><div class="qr"><img id="qr" alt="客服微信二维码" hidden><div id="state" role="status"><span id="message">正在加载客服二维码…</span><br><button class="retry" id="retry" hidden>重新加载</button></div></div><p class="hint" id="hint">请稍候</p><button class="confirm">我知道了</button><script>
(()=>{const $=id=>document.getElementById(id),qr=$('qr'),state=$('state'),retry=$('retry'),hint=$('hint');let generation=0,controller;
function show(data){generation++;qr.hidden=true;qr.removeAttribute('src');state.hidden=false;retry.hidden=true;
if(data.type==='image'){const ticket=generation;qr.onload=()=>{if(ticket!==generation)return;qr.hidden=false;state.hidden=true;hint.textContent='请使用手机微信扫一扫'};qr.onerror=()=>{if(ticket===generation)show({type:'error',message:'客服二维码加载失败，请重试'})};qr.src='data:image/png;base64,'+data.pngBase64;}
else if(data.type==='loading'){$('message').textContent='正在加载客服二维码…';hint.textContent='请稍候'}
else if(data.type==='empty'){$('message').textContent='客服二维码暂未设置\n请稍后再试';hint.textContent='客服配置完成后，将在此显示二维码';retry.hidden=false}
else{$('message').textContent=data.message||'客服二维码加载失败，请检查网络后重试';hint.textContent='暂时无法读取客服信息';retry.hidden=false}}
async function browserLoad(){controller?.abort();controller=new AbortController();const c=controller;const timer=setTimeout(()=>c.abort(),15000);show({type:'loading'});try{const response=await fetch('/brand/support',{cache:'no-store',signal:c.signal});if(!response.ok)throw Error();const data=await response.json();if(c!==controller)return;if(!data.qrUrl){show({type:'empty'});return}const url=new URL(data.qrUrl,location.origin);if(url.origin!==location.origin||url.pathname!='/brand/support/qr.png')throw Error();const image=await fetch(url,{cache:'no-store',signal:c.signal});if(!image.ok)throw Error();const blob=await image.blob();if(blob.size>2097152)throw Error();const reader=new FileReader();reader.onload=()=>{if(c===controller)show({type:'image',pngBase64:reader.result.split(',')[1]})};reader.readAsDataURL(blob)}catch{if(c===controller)show({type:'error'})}finally{clearTimeout(timer)}}
function send(type){if(window.chrome?.webview)window.chrome.webview.postMessage({type});else if(type==='support-close'){controller?.abort();window.close()}else void browserLoad()}
retry.onclick=()=>send('support-retry');document.querySelectorAll('.close,.confirm').forEach(button=>button.onclick=()=>send('support-close'));document.addEventListener('keydown',event=>{if(event.key==='Escape')send('support-close')});if(window.chrome?.webview)window.chrome.webview.addEventListener('message',event=>show(event.data));send('support-ready');document.querySelector('.confirm').focus();})();
</script></body></html>
