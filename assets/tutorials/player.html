  function icon(name,className=''){const el=document.createElement('img');el.className=`ti ti-${name} ${className}`;el.src=icons[name];el.alt='';el.setAttribute('aria-hidden','true');return el;}
  function fitCatalog(){
    if(view!=='catalog'||catalog.hidden)return;
    delete document.body.dataset.catalogDensity;
    for(const density of ['compact','dense']){
      if(list.scrollHeight<=list.clientHeight+1)break;
      document.body.dataset.catalogDensity=density;
    }
  }
  window.addEventListener('resize',fitCatalog);
  function renderCatalog(){
    const query=search.value.trim().toLocaleLowerCase(), known=new Set();list.replaceChildren();
    const sections=groups.map(group=>({...group,items:group.features.flatMap(([code,label])=>{known.add(code);const item=catalogItems.find(x=>x.featureCode===code);return item?[{...item,label}]:[];})}));
    const other=catalogItems.filter(x=>!known.has(x.featureCode)).map(item=>({...item,label:item.title||'视频教程'}));
    if(other.length)sections.push({name:'其他教程',description:'其他功能的操作教程',icon:'video',items:other});
    let visible=0;
    sections.forEach(group=>{
      const items=group.items.filter(item=>`${item.label} ${item.title||''} ${group.name} ${item.featureCode}`.toLocaleLowerCase().includes(query));
      if(!items.length)return;visible+=items.length;
      const section=document.createElement('section');section.className='tutorial-group';section.setAttribute('aria-label',group.name);
      const intro=document.createElement('div');intro.className='group-intro';intro.append(icon(group.icon,'group-icon'));
      const copy=document.createElement('div');copy.className='group-copy';const heading=document.createElement('h2');heading.textContent=group.name;
      const description=document.createElement('p');description.textContent=group.description;copy.append(heading,description);intro.append(copy);
      const grid=document.createElement('div');grid.className='group-tutorials';
      items.forEach(item=>{
        const button=document.createElement('button');button.type='button';button.className='tutorial-card';button.dataset.feature=item.featureCode;button.setAttribute('aria-label',`观看${item.label}教程`);button.title=item.title||item.label;
        const name=document.createElement('strong');name.textContent=item.label;const play=document.createElement('span');play.className='play-icon';play.append(icon('player-play'));button.append(name,play);
        button.onclick=()=>post('cb-tutorial-select',{featureCode:item.featureCode});grid.append(button);
      });section.append(intro,grid);list.append(section);
    });
    document.getElementById('catalog-summary').textContent=query?`找到 ${visible} 个教程 · 共 ${catalogItems.length} 个`:`${catalogItems.length} 个可观看教程`;
    document.getElementById('catalog-empty').hidden=visible>0;
    document.getElementById('catalog-empty-text').textContent=query?'未找到匹配的教程，试试其他功能名称':'暂无可观看教程，可刷新列表重试';
    document.getElementById('catalog-clear').hidden=!query;
    fitCatalog();
  }
  search.addEventListener('input',()=>{renderCatalog();catalog.scrollTop=0;});
  document.getElementById('catalog-clear').onclick=()=>{search.value='';renderCatalog();search.focus();};
  window.cbTutorialReceive=data=>{
    if(data.type==='catalog'){
      stop();setView('catalog');catalog.hidden=false;area.hidden=true;back.hidden=true;speedControl.hidden=true;
      title.textContent='视频教程';subtitle.textContent='按功能找到对应教程';
      const seen=new Set();catalogItems=(Array.isArray(data.items)?data.items:[]).filter(item=>{if(!item||typeof item.featureCode!=='string'||!item.featureCode||seen.has(item.featureCode))return false;seen.add(item.featureCode);return true;});
      renderCatalog();
      const note=document.getElementById('catalog-note');note.hidden=!data.partial;note.textContent='部分教程暂时未能读取，可刷新列表重试。';
      status.textContent=data.partial?note.textContent:'选择一个教程即可开始播放';fitCatalog();return;
    }
    if(data.type==='loading'){stop();completed=false;setView(data.catalog?'catalog-loading':'player');catalog.hidden=true;area.hidden=false;back.hidden=!data.canBrowse;speedControl.hidden=!!data.catalog;if(data.catalog){title.textContent='视频教程';subtitle.textContent='按功能找到对应教程';}show(data.catalog?'正在读取教程列表…':'正在读取教程…',false);status.textContent=data.catalog?'正在获取可观看的教程':'正在获取最新教程链接';return;}
    if(data.type==='error'){stop();catalog.hidden=true;area.hidden=false;back.hidden=!data.canBrowse;show(data.message,!!data.retry);status.textContent='返回操作后，可以继续使用软件。';return;}
    if(data.type!=='tutorial')return;
    stop();completed=false;reportedProgress=false;setView('player');catalog.hidden=true;area.hidden=false;back.hidden=!data.canBrowse;speedControl.hidden=false;title.textContent=data.title||'视频教程';subtitle.textContent='跟着教程，完成当前功能的操作';
    show('正在加载视频…',false);status.textContent='正在连接视频';
    video.src=data.videoUrl;video.playbackRate=Number(document.getElementById('speed').value);
    loadTimer=setTimeout(()=>{if(video.readyState<2)failure();},20000);void play();
  };
  video.addEventListener('playing',()=>{if(view!=='player')return;clearTimeout(loadTimer);overlay.hidden=true;status.textContent='正在播放';revealControls();post('cb-tutorial-playback',{state:'playing',seconds:video.currentTime});});
  video.addEventListener('timeupdate',()=>{if(view==='player'&&!video.paused&&!reportedProgress&&video.currentTime>=3){reportedProgress=true;post('cb-tutorial-playback',{state:'progress',seconds:video.currentTime});}});
  video.addEventListener('loadeddata',()=>{if(view!=='player')return;clearTimeout(loadTimer);if(video.paused){show('教程已就绪，点击开始播放',false);start.hidden=false;}});
  video.addEventListener('waiting',()=>{status.textContent='正在缓冲…';});
  video.addEventListener('pause',()=>{revealControls();if(video.currentSrc&&!completed)status.textContent='已暂停';});
  video.addEventListener('ended',()=>{revealControls();completed=true;status.textContent='已观看完毕，可以返回软件操作';});
  video.addEventListener('error',()=>{if(video.getAttribute('src'))failure();});
  document.getElementById('speed').onchange=event=>{video.playbackRate=Number(event.target.value);};
  document.getElementById('close').onclick=()=>{stop();post('cb-tutorial-close');};
  back.onclick=()=>{stop();post('cb-tutorial-catalog');};document.getElementById('catalog-refresh').onclick=()=>post('cb-tutorial-retry');
  retry.onclick=()=>post('cb-tutorial-retry');start.onclick=()=>void play();
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!document.fullscreenElement){stop();post('cb-tutorial-close');}});
  window.addEventListener('pagehide',stop);
  window.chrome?.webview?.addEventListener('message',event=>window.cbTutorialReceive(event.data));
  post('cb-tutorial-player-ready');
})();
</script></body></html>
