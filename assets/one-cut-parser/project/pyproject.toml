[project]
name = "douyin-8k-parser"
version = "0.1.0"
description = "Resolve high-bitrate / original Douyin video URLs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lijinrui182" }]
keywords = ["douyin", "aweme", "video", "downloader", "8k", "parser"]
dependencies = ["requests>=2.32.0"]

[project.scripts]
douyin-8k-parser = "douyin_8k_parser:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
