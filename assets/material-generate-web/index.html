<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>AI商品卡</title>
  <link rel="stylesheet" href="styles.css?v=credit-confirm-20260913">
  <link rel="stylesheet" href="records.css?v=records-table-20260913">
  <link rel="stylesheet" href="../ai-product-card-ui/shell.css?v=1">
  <link rel="stylesheet" href="../ai-product-card-ui/fit.css?v=2">
  <link rel="stylesheet" href="../ai-product-card-ui/refine.css?v=3">
  <link rel="stylesheet" href="../ai-product-card-ui/desktop.css?v=4">
</head>
<body data-card-page="generate">
  <script src="../ai-product-card-ui/shell.js?v=4"></script>
  <main id="app" class="app" aria-label="AI商品卡工作台">
    <section id="workflow" class="workflow" aria-label="素材生成流程"></section>
    <section class="workspace">
      <aside id="productPanel" class="panel product-panel" aria-label="商品库"></aside>
      <section id="centerPanel" class="center-panel" aria-label="素材编辑与预览"></section>
      <aside id="assistantPanel" class="panel assistant-panel" aria-label="AI策划助手"></aside>
    </section>
    <footer id="actionBar" class="action-bar"></footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="generationCreditDialog" class="credit-dialog" aria-labelledby="creditDialogTitle" aria-describedby="creditDialogDescription">
    <div class="credit-dialog-content">
      <div class="credit-dialog-heading"><span class="credit-dialog-icon" aria-hidden="true">算力</span><button type="button" id="closeCreditDialog" class="credit-dialog-close" aria-label="关闭扣费确认">×</button></div>
      <h2 id="creditDialogTitle">生成图片扣费确认</h2>
      <p id="creditDialogDescription">图片生成需要消耗算力，请确认本次生成数量和费用。</p>
      <dl class="credit-breakdown">
        <div><dt>生成数量</dt><dd id="creditDialogCount"></dd></div>
        <div><dt>单张费用</dt><dd id="creditDialogUnit"></dd></div>
        <div class="credit-total"><dt>本次扣除</dt><dd id="creditDialogTotal"></dd></div>
      </dl>
      <p class="credit-dialog-note">点击确认后开始生成；取消不会提交生成任务。</p>
      <div class="credit-dialog-actions"><button type="button" id="cancelCreditGeneration">取消</button><button type="button" id="confirmCreditGeneration" class="primary"></button></div>
    </div>
  </dialog>
  <script src="records.js?v=records-table-20260913"></script>
  <script src="app.js?v=refine3-records-table-20260913"></script>
  <script src="../ai-product-card-ui/fit.js?v=4"></script>
</body>
</html>
