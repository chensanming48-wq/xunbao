<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="color-scheme" content="light">
  <title>自动上传工作台</title>
  <link rel="stylesheet" href="styles.css?v=start-upload-icon-20260912">
  <link rel="stylesheet" href="../ai-product-card-ui/shell.css?v=1">
  <link rel="stylesheet" href="../ai-product-card-ui/fit.css?v=2">
  <link rel="stylesheet" href="../ai-product-card-ui/refine.css?v=3">
  <link rel="stylesheet" href="../ai-product-card-ui/desktop.css?v=4">
</head>
<body data-card-page="upload">
  <script src="../ai-product-card-ui/shell.js?v=4"></script>
  <main class="upload-page" aria-label="上传千川自动上传工作台">


    <section class="card config-card" aria-label="上传配置">
      <h2>上传设置</h2>
      <div class="config-grid">
        <label class="field">
          <span>目标店铺</span>
          <select id="shopSelect" aria-label="目标店铺"></select>
        </label>
        <label class="field">
          <span>目标计划</span>
          <select id="planSelect" aria-label="目标计划"></select>
        </label>
        <label class="field retry-field">
          <span>失败重试</span>
          <select id="retrySelect" aria-label="失败重试次数">
            <option value="0">不自动重试</option>
            <option value="1">自动重试 1 次</option>
            <option value="2">自动重试 2 次</option>
            <option value="3">自动重试 3 次</option>
          </select>
        </label>

        <button class="outline refresh-plan" id="refreshPlans" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"></path><path d="M19 12a7 7 0 10-1.7 4.6"></path></svg>
          <span id="refreshPlansLabel">刷新计划</span>
        </button>
      </div>
      <p class="shop-selection-hint">列出当前店铺的全部千川计划，关联商品一致的计划优先推荐。</p>
      <div class="plan-guidance" id="unassociatedHint" hidden>
        <span>这些图片没有关联商品，可选择商品后获得推荐计划</span>
        <button class="outline" id="chooseProduct" type="button">选择商品</button>
      </div>
      <div class="plan-guidance" id="sourceProductPicker" hidden>
        <label for="uploadProductSelect">关联商品</label>
        <select id="uploadProductSelect" aria-label="关联商品"></select>
        <button class="outline" id="applyUploadProduct" type="button">确认关联</button>
        <button class="outline" id="openProductCatalog" type="button">去商品库</button>
      </div>
      <div class="plan-guidance plan-warning" id="planMismatch" role="status" aria-live="polite" hidden>
        <span>该计划推广的是另一个商品，图片与商品不一致，千川审核可能不通过</span>
        <button class="outline" id="confirmPlanProduct" type="button">我已知晓，继续使用该计划</button>
      </div>
      <div class="plan-guidance" id="planEmpty" role="status" hidden>
        <span>请先创建计划</span><button class="outline" id="createPlan" type="button">去创建计划</button>
      </div>
      <div class="plan-guidance plan-warning" id="planProblem" role="status" aria-live="polite" hidden>
        <span id="planProblemText"></span>
        <button class="outline" id="loginQianchuan" type="button" hidden>登录千川</button>
        <button class="outline" id="retryPlans" type="button">重试</button>
      </div>
      <div class="config-summary" id="configSummary">请选择目标店铺与计划，添加素材后即可启动任务</div>
      <div class="config-summary" id="planRefreshStatus" role="status" aria-live="polite" hidden></div>
    </section>

    <section class="work-grid">
      <article class="card queue-card">
        <div class="queue-head">
          <div class="queue-title">
            <h2>待上传素材</h2>
            <span id="queueSummary">共 0 个</span>
          </div>
          <div class="queue-head-actions"><button class="outline add-button" id="addFiles" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            添加素材
          </button><button class="soft-button" id="clearQueue" type="button"><img class="card-line-icon" src="../ai-product-card-ui/trash-2.svg" alt="">清空</button></div>
        </div>

        <div class="queue-tools">
          <label class="select-all">
            <input id="selectAll" type="checkbox">
            <span class="check-mark" aria-hidden="true"></span>
            <span>全选</span>
          </label>
          <button class="soft-button" id="removeSelected" type="button"><img class="card-line-icon" src="../ai-product-card-ui/trash-2.svg" alt="">移除</button>
        </div>

        <button class="drop-zone" id="dropZone" type="button">
<img class="card-line-icon" src="../ai-product-card-ui/cloud-upload.svg" alt="">
          <span>拖入图片</span><small>支持图片格式</small>
        </button>

        <div class="queue-table" role="table" aria-label="待上传素材列表">
          <div class="queue-columns" role="row">
            <span role="columnheader">预览</span>
            <span role="columnheader">素材文件</span>
            <span role="columnheader">类型</span>
            <span role="columnheader">大小</span>
            <span role="columnheader">目标计划</span>
            <span role="columnheader">上传状态</span>
            <span role="columnheader">操作</span>
          </div>
          <div class="queue-body" id="queueBody" role="rowgroup"></div>
        </div>




      </article>

      <aside class="assistant-column">
        <article class="card automation-card">
          <h2>上传进度</h2>
          <div class="progress-summary">
            <div class="progress-ring" id="progressRing" style="--progress:0">
              <div><strong id="progressPercent">0%</strong></div>
            </div>
          </div>

          <span class="upload-tally" id="uploadTally">0/0</span>
          <button class="primary start-button" id="startUpload" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l15 9-15 9V3z"></path></svg>
            开始上传
          </button>
          <div class="secondary-actions">
            <button class="outline" id="pauseUpload" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"></path></svg>
              <span id="pauseText">暂停任务</span>
            </button>
            <button class="outline dark" id="cancelUpload" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
              取消任务
            </button>
          </div>

        </article>

        <article class="card log-card">
          <details>
            <summary class="log-head"><h2><img class="card-line-icon" src="../ai-product-card-ui/file-text.svg" alt="">实时日志</h2><span class="log-toggle" aria-hidden="true"></span></summary>
            <div class="log-output" id="logOutput" aria-live="polite"></div>
          </details>
          <button class="text-button" id="openHistory" type="button"><img class="card-line-icon" src="../ai-product-card-ui/file-text.svg" alt="">查看上传记录</button>
        </article>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=refine3-plan-refresh-progress-20260912"></script>
  <script src="../ai-product-card-ui/fit.js?v=4"></script>
</body>
</html>
